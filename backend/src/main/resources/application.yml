spring:
  application:
    name: ascend-commoni
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ascend_monitor}
    username: ${SPRING_DATASOURCE_USERNAME:ascend}
    password: ${SPRING_DATASOURCE_PASSWORD:ascend}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
        jdbc.batch_size: 100
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

monitor:
  contest-id: ${MONITOR_CONTEST_ID:41ffbad2024e4ccfa43520c57ffa7b9e}
  source-base-url: ${MONITOR_SOURCE_BASE_URL:https://www.hiascend.com/ascendgateway/ascendservice}
  source-page-url: ${MONITOR_SOURCE_PAGE_URL:https://www.hiascend.com/developer/contests/details/41ffbad2024e4ccfa43520c57ffa7b9e?module=rank}
  poll-interval-ms: ${MONITOR_POLL_INTERVAL_MS:120000}
  initial-delay-ms: ${MONITOR_INITIAL_DELAY_MS:5000}
  page-size: ${MONITOR_PAGE_SIZE:50}
  history-max-points: ${MONITOR_HISTORY_MAX_POINTS:1200}
  retention-days: ${MONITOR_RETENTION_DAYS:90}
  detection:
    regression-percent: ${DETECTION_REGRESSION_PERCENT:15}
    hiding-percent: ${DETECTION_HIDING_PERCENT:25}
    rebound-percent: ${DETECTION_REBOUND_PERCENT:15}
    near-best-percent: ${DETECTION_NEAR_BEST_PERCENT:5}
    submission-burst: ${DETECTION_SUBMISSION_BURST:8}

logging:
  level:
    com.ascend.monitor: ${APP_LOG_LEVEL:INFO}
